[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro reads `process.env.URL` for the canonical origin. Netlify sets URL to the
# primary site address on production builds and DEPLOY_PRIME_URL on previews.
[context.deploy-preview.environment]
  URL = "$DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
  URL = "$DEPLOY_PRIME_URL"

# Fingerprinted assets and self-hosted fonts never change under a given name.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
